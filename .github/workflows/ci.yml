name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The unit tests build their own fixtures, so the corpus is not
          # needed here. Skipping it keeps this job fast; the build job pulls
          # it because the image bakes it in.
          submodules: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: latest
          install-go: false

  zizmor:
    # Static analysis of these very workflows. A CI pipeline is an execution
    # environment with access to secrets and a package registry, so it deserves
    # the same scrutiny as the code it builds.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # SARIF upload needs GitHub Advanced Security; without it the job
          # would fail on the upload rather than on real findings. Findings are
          # printed in the log and fail the job on their own.
          advanced-security: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The image bakes the corpus in, so the submodule is required.
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: build binaries
        run: |
          go build -trimpath -o bin/mcp-misp-galaxy ./cmd/mcp-misp-galaxy
          go build -trimpath -o bin/galaxy-tui ./cmd/galaxy-tui

      - name: load the real corpus
        # The unit tests use synthetic fixtures, so nothing else here would
        # catch a corpus that fails to parse after an upstream schema change.
        run: ./bin/mcp-misp-galaxy -root . -no-sync -stats

      - name: docker build
        run: |
          docker build \
            --build-arg CORPUS_REF="$(git -C data/misp-galaxy rev-parse HEAD)" \
            -t mcp-misp-galaxy:ci .

      - name: smoke test the image
        # Checks the container path specifically: no git repository, corpus
        # cloned at build time, provenance read from the file the build wrote.
        run: docker run --rm mcp-misp-galaxy:ci -no-sync -stats

  publish:
    # Every push to main, which includes every merged pull request — they are
    # the same event. Deliberately NOT on pull_request: a PR from a fork must
    # never be able to write to the registry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, staticcheck, zizmor, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The corpus is cloned inside the image build; the submodule pointer
          # is only read to pin which commit that clone should fetch.
          submodules: recursive

      - name: record the corpus commit
        id: corpus
        run: echo "ref=$(git -C data/misp-galaxy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          push: true
          # 'edge' tracks main; the sha tag is what you pin a deployment to.
          # 'latest' stays with tagged releases — a merge is not a release.
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            CORPUS_REF=${{ steps.corpus.outputs.ref }}
            VERSION=edge-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # By digest, never by tag: a tag can be moved after signing.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
