name: release

# Tags only. A registry push is a publication, and publications should be named
# and deliberate rather than a side effect of merging to main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Cosign keyless signing exchanges this token for a certificate, so the
      # signature is bound to this workflow rather than to a key someone holds.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: record the corpus commit
        id: corpus
        run: echo "ref=$(git -C data/misp-galaxy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CORPUS_REF=${{ steps.corpus.outputs.ref }}
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign by digest, never by tag: a tag can be moved after signing.
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done

  binaries:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # No cache in a publishing workflow. A cache entry poisoned by an
          # earlier run on a branch would end up baked into a signed release
          # artefact, and the few seconds saved are not worth that.
          cache: false

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          suffix="${GOOS}-${GOARCH}"
          # The tag is stamped into the binary, so a released artefact reports
          # the version it was cut from rather than a number left in the source.
          ldflags="-s -w -X main.version=${TAG}"
          go build -trimpath -ldflags="$ldflags" -o "mcp-misp-galaxy-${suffix}" ./cmd/mcp-misp-galaxy
          go build -trimpath -ldflags="$ldflags" -o "galaxy-tui-${suffix}" ./cmd/galaxy-tui
          shasum -a 256 "mcp-misp-galaxy-${suffix}" "galaxy-tui-${suffix}" > "checksums-${suffix}.txt"

      - name: publish the artefacts
        # gh is preinstalled on every runner, so a third-party action here would
        # add a supply-chain dependency for something the runner already does.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          suffix="${GOOS}-${GOARCH}"
          # The matrix legs race to create the release; the losers fail
          # harmlessly and go straight to uploading.
          gh release create "$TAG" --generate-notes --verify-tag || true
          gh release upload "$TAG" --clobber \
            "mcp-misp-galaxy-${suffix}" \
            "galaxy-tui-${suffix}" \
            "checksums-${suffix}.txt"
